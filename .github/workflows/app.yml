# The desktop app's test gate. Everything the app ships is checked here and
# nowhere else: release.yml is tag-only (so a broken main never gets caught),
# and release-cli.yml tests only the CLI crate — the app's Rust tests, its
# vitest suite and its `tsc` type-check had no CI at all before this.
#
# The one thing a reader would otherwise get wrong: `cargo test` runs
# *unfiltered*. Passing a filter — `cargo test git::`, any `--` tail — makes
# ts-rs regenerate `src/types/events.ts` with only the types whose exports
# actually ran, so the frontend build on that branch fails for everyone who
# pulls it. Leave the command bare.
name: app

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/cli/**"
      - "crates/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/app.yml"
      # The gate runs inside this action; a change to it can break the gate.
      - ".github/actions/desktop-setup/**"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/cli/**"
      - "crates/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/app.yml"
      - ".github/actions/desktop-setup/**"

# Nothing here writes anything but a status check.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    # A wedged build would otherwise hold the runner for GitHub's six-hour cap.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Everything the release and warm-cache jobs use: node/pnpm/Rust with
      # both Apple targets, the cargo cache, and the CEF build tools. Its last
      # step is `pnpm install --frozen-lockfile` at the repo root, so the
      # install is not repeated below.
      - uses: ./.github/actions/desktop-setup

      # `tsc && vite build`. Two jobs in one: it is the type-check gate, and it
      # writes the `dist/` that the Rust step below needs on disk — the cargo
      # build runs `tauri::generate_context!()`, which reads `frontendDist`
      # from tauri.conf.json at compile time and fails when it is missing.
      - name: Type-check and build the frontend
        run: pnpm --filter hz run build

      - name: Run the frontend tests
        run: pnpm --filter hz run test

      # Lint only — no formatter is configured, and biome.jsonc says why. This
      # catches the class of mistake a reader cannot see either: an unused
      # import, a `==`, a hook called conditionally.
      - name: Lint the frontend
        run: pnpm --filter hz run lint

      # Bare, never filtered — see the header. A filtered run rewrites
      # src/types/events.ts with a partial type set and breaks the frontend
      # build for anyone who pulls the branch.
      - name: Run the Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      # `-D warnings`, so this is a gate rather than a wall nobody reads. The
      # set was nine warnings the day it went in, every one of them in test
      # code, and all of them fixed rather than allowed — `--all-targets` is
      # what finds those, so it stays.
      #
      # Deliberately **no `cargo fmt --check`**: this tree is shaped by hand and
      # rustfmt's first run rewrites 319 files, which is the same bargain
      # biome.jsonc records for the frontend.
      - name: Lint the Rust
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Neither of these had a gate at all before this. `release-cli.yml` is
      # tag-only, so the CLI's own tests ran for the first time on the release
      # that shipped them; and `hz-proto`'s are its own package's, so the
      # `cargo test` above — which is `src-tauri`'s — never reached them even
      # though the path filter already watched `crates/**`. Both are plain
      # crates with no Tauri in them, so this is seconds — and `hz-proto` is the
      # wire shape the two sides share, which is the seam that must not drift.
      #
      # The agent launcher joins them for the same reason: it is its own
      # package, and nothing above compiles it. Windows is where it ships, but
      # a crate that compiles on one platform and not another is a bad trade
      # for the two lines it costs here.
      - name: Test and lint the wire crate, the CLI and the agent launcher
        run: |
          cargo test --manifest-path crates/hz-proto/Cargo.toml
          cargo clippy --manifest-path crates/hz-proto/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path apps/cli/Cargo.toml
          cargo clippy --manifest-path apps/cli/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path apps/agent-launcher/Cargo.toml
          cargo clippy --manifest-path apps/agent-launcher/Cargo.toml --all-targets -- -D warnings
