[package]
name = "hz"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
description = "Create and list hz sessions from the command line."
repository = "https://github.com/Hamertingo/hz"

[[bin]]
name = "hz"
path = "src/main.rs"

[dependencies]
hz-proto = { path = "../../crates/hz-proto" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
