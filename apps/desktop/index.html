<!doctype html>
<html lang="en" data-theme="default" data-mode="light" data-transparency>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyze Code</title>
    <script>
      // Runs before first paint so a stored theme never shows as a flash of the
      // default one. Kept in sync with src/lib/theme.ts by hand — it can't import.
      //
      // These three keys, and the view state beside them, are the ones that stay
      // in local storage while the reader's preferences live in
      // `~/.hz/settings.json`: nothing that runs before the first frame can await
      // a command. src/hooks/useLocalStorage.ts lists them and says so.
      //
      // The old prefix rides along as a fallback: the rename of these keys is
      // done by `adoptPreviousStorageKeys` in main.tsx, which runs *after* this
      // script, so the first launch over a build that stored them lands here.
      try {
        var stored = function (key) {
          var v = localStorage.getItem("hz." + key);
          return v === null ? localStorage.getItem("ade." + key) : v;
        };
        var t = stored("theme") || "default";
        var m = stored("mode") || "light";
        var dark =
          m === "dark" ||
          (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        var el = document.documentElement;
        el.dataset.theme = t;
        el.dataset.mode = dark ? "dark" : "light";
        el.classList.toggle("dark", dark);
        el.style.colorScheme = dark ? "dark" : "light";
        // Unconditional, and it reads no preference to decide it: a window is
        // translucent, full stop. The stored setting only ever applies in
        // fullscreen, and nothing can know it is fullscreen before first paint,
        // so `useGlass` owns that case and this owns the ordinary one.
        el.dataset.transparency = "";
        // The window's material is macOS-only, so the translucency that reveals
        // it is too — anywhere else it would punch a hole through to nothing.
        // It is the macOS flavour of the transparency above, not a second one:
        // the CSS only applies it where both attributes are present. `useGlass`
        // clears it while fullscreen, which leaves the surfaces translucent
        // against the theme's own backdrop instead of going flat.
        if (/Mac/.test(navigator.platform)) el.dataset.vibrancy = "";
      } catch (e) {}
      // Same bargain for text sizes, mirrored from src/lib/fontSize.ts: a
      // stored size never shows as a flash of the default. Clamped exactly as
      // `coerceFontSizes` clamps, or an out-of-range value paints at the CSS
      // default here and jumps to the clamped size once React takes over.
      try {
        var sizes = JSON.parse(stored("fontSizes") || "{}");
        ["chat", "code", "ui"].forEach(function (slot) {
          var px = sizes[slot];
          if (typeof px === "number" && isFinite(px)) {
            px = Math.min(24, Math.max(10, Math.round(px)));
            document.documentElement.style.setProperty("--fs-" + slot, px + "px");
          }
        });
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
